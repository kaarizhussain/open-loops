name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # node:sqlite, for the report-worker suite
      # No install step: the detector has no dependencies, and keeping it that way is
      # the point. If this ever needs `npm ci`, something was added that should not
      # have been.
      - run: npm test
